name: Branch Deploy to Google Play Console

on:
  push:
    branches:
      - 'release/**'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - dev
          - prod
      custom_version_name:
        description: 'Version Name override (e.g. 1.0.5, leave blank to use pubspec/branch)'
        required: false
        default: ''
      custom_version_code:
        description: 'Version Code override (integer, leave blank for auto-calculated)'
        required: false
        default: ''
      track_dev:
        description: 'Track for Dev flavor (com.grubpac.medical.test)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
      track_prod:
        description: 'Track for Prod flavor (com.grubpac.medical)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - inProgress
          - draft
      rollout_fraction:
        description: 'Staged rollout fraction (e.g. 0.2 for 20%, only used if status is inProgress)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (en-US)'
        required: false
        default: 'Performance improvements and bug fixes.'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deploy-check:
    name: Pre-deployment Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-and-deploy:
    name: Deploy ${{ matrix.flavor }} to Play Console
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ github.event.inputs.flavor == 'dev' && fromJson('["dev"]') || github.event.inputs.flavor == 'prod' && fromJson('["prod"]') || fromJson('["dev", "prod"]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-play-deploy-${{ matrix.flavor }}-${{ hashFiles('**/pubspec.lock', 'android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-play-deploy-${{ matrix.flavor }}-

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing! Play Console deployment requires a signed release build."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
          echo "--> Keystore and key.properties created."

      - name: Install Dependencies
        run: flutter pub get

      - name: Resolve Version and Auto-Increment Build Number
        id: version
        run: |
          PUB_VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          PUB_VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d ' ')
          PUB_VERSION_CODE=${PUB_VERSION_CODE:-1}

          AUTO_CODE=$((PUB_VERSION_CODE + GITHUB_RUN_NUMBER))

          FINAL_CODE="${{ github.event.inputs.custom_version_code }}"
          if [ -z "$FINAL_CODE" ]; then
            FINAL_CODE=$AUTO_CODE
          fi

          BRANCH_NAME="${{ github.ref_name }}"
          DETECTED_NAME=$(echo "$BRANCH_NAME" | sed -n 's/^release\/v*//p')

          FINAL_NAME="${{ github.event.inputs.custom_version_name }}"
          if [ -z "$FINAL_NAME" ]; then
            if [ -n "$DETECTED_NAME" ]; then
              FINAL_NAME="$DETECTED_NAME"
            else
              FINAL_NAME="$PUB_VERSION_NAME"
            fi
          fi

          echo "version_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$FINAL_CODE" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo " Auto-resolved Version Name: $FINAL_NAME"
          echo " Auto-incremented Build Code: $FINAL_CODE"
          echo "=================================================="

      - name: Build App Bundle (${{ matrix.flavor }})
        run: |
          TARGET_MAIN="lib/main_${{ matrix.flavor }}.dart"
          flutter build appbundle \
            --flavor ${{ matrix.flavor }} \
            -t $TARGET_MAIN \
            --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.version_code }}

          AAB_PATH="build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Expected AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        run: |
          mkdir -p distribution/whatsnew
          NOTES="${{ github.event.inputs.release_notes || 'Performance improvements and bug fixes.' }}"
          echo "$NOTES" > distribution/whatsnew/whatsnew-en-US
          echo "Release notes written: $(cat distribution/whatsnew/whatsnew-en-US)"

      - name: Determine Deployment Parameters
        id: meta
        run: |
          if [ "${{ matrix.flavor }}" = "dev" ]; then
            PACKAGE_NAME="com.grubpac.medical.test"
            TRACK="${{ github.event.inputs.track_dev || 'internal' }}"
          else
            PACKAGE_NAME="com.grubpac.medical"
            TRACK="${{ github.event.inputs.track_prod || 'internal' }}"
          fi

          STATUS="${{ github.event.inputs.release_status || 'completed' }}"
          USER_FRACTION=""

          # userFraction is only valid for inProgress releases on non-internal tracks
          if [ "$STATUS" = "inProgress" ] && [ "$TRACK" != "internal" ]; then
            INPUT_FRACTION="${{ github.event.inputs.rollout_fraction }}"
            if [ -n "$INPUT_FRACTION" ] && [ "$INPUT_FRACTION" != "1" ] && [ "$INPUT_FRACTION" != "1.0" ]; then
              USER_FRACTION="$INPUT_FRACTION"
            else
              STATUS="completed"
              USER_FRACTION=""
            fi
          fi

          # Optional mapping file
          MAPPING_FILE="build/app/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt"
          MAPPING_ARG=""
          if [ -f "$MAPPING_FILE" ]; then
            MAPPING_ARG="$MAPPING_FILE"
          fi

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "user_fraction=$USER_FRACTION" >> $GITHUB_OUTPUT
          echo "mapping_file=$MAPPING_ARG" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo " Package: $PACKAGE_NAME"
          echo " Track:   $TRACK"
          echo " Status:  $STATUS"
          echo " Fraction: ${{USER_FRACTION:-'(none - full release)'}}"
          echo " Mapping: ${{MAPPING_ARG:-'(none)'}}"
          echo "=================================================="

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ steps.meta.outputs.package_name }}
          releaseFiles: build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          track: ${{ steps.meta.outputs.track }}
          status: ${{ steps.meta.outputs.status }}
          userFraction: ${{ steps.meta.outputs.user_fraction }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: ${{ steps.meta.outputs.mapping_file }}

      - name: Add Deployment Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### Play Console Deployment: `${{ matrix.flavor }}`
          - **Package Name**: `${{ steps.meta.outputs.package_name }}`
          - **Track**: `${{ steps.meta.outputs.track }}`
          - **Status**: `${{ steps.meta.outputs.status }}`
          - **Version Name**: `${{ steps.version.outputs.version_name }}`
          - **Version Code**: `${{ steps.version.outputs.version_code }}`
          - **Result**: Successful
          EOF
